name: Go checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: bash -n scripts/deploy.sh scripts/deploy-activate.sh scripts/test-deploy-docker.sh
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/litepay-amd64 .
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/litepay-arm64 .
  docker-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/litepay-ci-binary .
      - run: sudo --preserve-env=PATH bash scripts/test-deploy-docker.sh
