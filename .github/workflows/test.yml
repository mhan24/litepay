name: Payment checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: Python backup and cancellation contracts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Expiry capacity benchmarks
        run: go test ./internal/store -run '^$' -bench 'BenchmarkExpire' -benchtime=1x
