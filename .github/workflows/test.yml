name: Payment checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: Security static analysis
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: Python backup and cancellation contracts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Expiry capacity benchmarks
        run: go test ./internal/store -run '^$' -bench 'BenchmarkExpire' -benchtime=1x
      - name: Production image startup contract
        run: |
          docker build -t litepay:ci .
          sh scripts/test_container.sh litepay:ci
