# Mount a configured copy at /app/config.yaml before running the container.
# Empty production prerequisites deliberately cause startup to fail.
server:
  production: true
  addr: "0.0.0.0:8080"
  base_url: ""
  notify_hosts: []
  trusted_proxies: []
  # 32 字节随机密钥的 64 位 hex 或 Base64；文件须归运行用户所有，权限 0400/0600。
  # 离线轮换：配置新密钥并执行 -rotate-master-key-from /path/to/old.key，成功后退出。
  master_key_file: ""
  # 留空禁用探针令牌；配置时至少 16 字节随机值，仅通过 X-Readiness-Token / X-Probe-Token / Authorization Header 传递。
  readiness_token: ""
  callback_workers: 8
  merchant_key_versions: false
  # Dujiao Next production requires the signed cancellation sync service.
  cancel_sync_required: true
database:
  path: "/app/data/litepay.db"
admin:
  path: "/admin"
  username: "admin"
  password: ""
  session_hours: 12
log_level: "info"
