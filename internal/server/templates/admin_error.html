<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>操作失败 · LitePay 管理后台</title>
{{template "theme_head" .}}
{{template "admin_css" .}}
{{template "layout_css" .}}
</head>
<body>
{{template "admin_nav" .}}
<div class="shell">
  <div class="card">
    <div class="admin-error-body card-b" >
      <div class="admin-error-icon" >!</div>
      <h1 class="admin-error-title" >操作未能完成</h1>
      <p class="admin-error-detail muted" >{{.Error}}</p>
      <a class="btn btn-ghost btn-sm" href="{{adminPath}}/orders">返回订单列表</a>
    </div>
  </div>
</div>
{{template "theme_script" .}}
</body>
</html>
