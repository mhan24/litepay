{{define "status_poll_script"}}<script>
window.pollOrderStatus=function(no,receive,stopped){
  var runs=0,failures=0,timer,running=false;
  function poll(){
    if(running||stopped())return;
    running=true;
    var retry=0,controller=new AbortController();
    var timeout=setTimeout(function(){controller.abort()},8000);
    fetch('/api/order/status?order_id='+encodeURIComponent(no),{cache:'no-store',signal:controller.signal})
      .then(function(r){if(!r.ok){retry=Math.min(120000,Math.max(0,Number(r.headers.get('Retry-After'))*1000||0));throw Error('status unavailable')}return r.json()})
      .then(function(r){if(r.code!==0)throw Error('status unavailable');failures=0;runs++;receive(r.data)})
      .catch(function(){failures=Math.min(failures+1,5)})
      .finally(function(){
        clearTimeout(timeout);running=false;
        if(stopped())return;
        var delay=document.hidden?15000:(runs<15?2000:5000);
        if(failures)delay=Math.max(delay,Math.min(30000,2000*Math.pow(2,failures)));
        timer=setTimeout(poll,Math.max(delay,retry)+Math.random()*500);
      });
  }
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&!running){clearTimeout(timer);poll()}});
  poll();
};
</script>{{end}}
