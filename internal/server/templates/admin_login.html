<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>登录 · {{.SiteName}}</title>
{{template "theme_head" .}}
{{template "theme_css" .}}
<style>
  body{display:grid;place-items:center;padding:24px}
  .login{width:100%;max-width:390px}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
  .mark{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;
    background:var(--text);color:var(--bg);font-size:11px;font-weight:800;letter-spacing:-.2px}
  .brand-copy{flex:1;min-width:0}
  .brand h1{margin:0;font-size:16px;letter-spacing:-.2px}
  .brand p{margin:3px 0 0;color:var(--muted);font-size:11.5px}
  .card{padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
  label{display:block;margin:15px 0 7px;color:var(--muted);font-size:12px;font-weight:580}
  input{width:100%;min-height:43px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--surface-2);color:var(--text);outline:none}
  input:focus{background:var(--surface);border-color:var(--line-strong);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 14%,transparent)}
  button{width:100%;min-height:43px;margin-top:22px;border:0;border-radius:10px;
    background:var(--text);color:var(--bg);font-weight:680;cursor:pointer}
  button:hover{opacity:.88}
  .err{margin:0 0 16px;padding:10px 12px;border:1px solid var(--danger-line);border-radius:9px;
    background:var(--danger-soft);color:var(--danger);font-size:12px;line-height:1.55}
  .foot{margin-top:20px;color:var(--faint);font-size:10.5px;line-height:1.65;text-align:center}
</style>
</head>
<body>
<main class="login">
  <div class="brand">
    <div class="mark">LP</div>
    <div class="brand-copy"><h1>{{.SiteName}}</h1><p>Binance / OKX 站内转账收银台</p></div>
    {{template "theme_toggle" .}}
  </div>
  <form class="card" method="post" action="/admin/login">
    {{if .Error}}<div class="err" role="alert">{{.Error}}</div>{{end}}
    <input type="hidden" name="next" value="{{.Next}}">
    <label for="username">管理员账号</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    <label for="password">登录密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">进入管理后台</button>
    <div class="foot">仅限授权人员访问。连续登录失败会触发临时限制。</div>
  </form>
</main>
{{template "theme_script" .}}
</body>
</html>
