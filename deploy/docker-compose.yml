# 生产编排：与既有基础设施（liteshop + Caddy）对齐
#   - Caddy 通过 `reverse_proxy litepay:3000` 经 liteshop_default 网络访问本服务，
#     因此服务名/容器名必须为 litepay，监听端口必须为 3000。
#   - 主机端口 127.0.0.1:3101 仅供本机调试，不对外暴露。
#   - 数据落在独立命名卷，删容器不丢数据。
services:
  litepay:
    build:
      context: .
      dockerfile: Dockerfile
    image: litepay:go
    container_name: litepay
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    cpus: "1.0"
    stop_grace_period: 15s
    environment:
      TZ: Asia/Shanghai
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "127.0.0.1:3101:3000"
    volumes:
      - litepay-data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  edge:
    external: true
    name: liteshop_default

volumes:
  litepay-data:
