# LitePay 启动配置
#
# 这里只放启动必需项。支付平台、收款 UID、订单和回调
# 都保存在 SQLite 中，首次启动后请在 /admin/settings 配置。

server:
  # 本机开发显式关闭；生产必须为 true，并配置 HTTPS 与商户主机白名单。
  production: false
  # 商城兼容历史密钥的联动验收通过后才可设为 true；否则生产轮换被阻止。
  merchant_key_versions: false
  # 访问根地址时跳转到商店；留空返回 404。
  store_url: ""
  addr: "0.0.0.0:8080"
  base_url: "http://localhost:8080"
  # 生产环境只填写实际反向代理的固定 IP/CIDR；默认忽略转发 IP 头。
  # Caddy 容器重建后如 IP 改变，必须同步更新此值。
  trusted_proxies: []
  # production 为 true 时必须填写；回调仅允许精确主机名和 HTTPS。
  notify_hosts: []

database:
  path: "./data/litepay-dev.db"

admin:
  # 后台入口前缀，可改为不易猜到的单层路径；也可在后台修改。
  path: "/admin"
  username: "admin"
  password: ""
  session_hours: 12

log_level: "info"
