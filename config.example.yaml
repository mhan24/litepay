# LitePay 启动配置文件示例
#
# 本文件仅包含服务进程启动所必需的基础配置项。
# 各支付平台 API 凭据、收款 UID、开放币种及金额规则均持久化在 SQLite 中，
# 服务首次启动后，请直接登录管理后台 /admin/settings 页面进行可视化配置。

server:
  # 并发商户回调工作协程数，默认 8，最大 32；单笔订单始终使用数据库租约隔离
  callback_workers: 8
  # 部署独角关单同步脚本并启用心跳上报后开启；若心跳过期，/readyz 将返回 503
  cancel_sync_required: false
  # 本地开发测试显式设为 false；生产环境必须设为 true，并强制配置 HTTPS 与商户回调白名单
  production: false
  # 当商城端完成对历史密钥兼容性的联动验收后方可开启；未开启前生产环境禁止轮换 Token
  merchant_key_versions: false
  # 访问服务根路径时的重定向商城地址；留空则默认返回 404
  store_url: ""
  addr: "0.0.0.0:8080"
  base_url: "http://localhost:8080"
  # 生产环境仅填写受信任的反向代理固定 IP 或 CIDR 网段；默认忽略不可信的客户端转发 IP 头
  # 反向代理（如 Caddy/Nginx）容器重建后若 IP 发生变化，须同步更新此项
  trusted_proxies: []
  # 敏感凭据 AES-256-GCM 加密主密钥只读文件路径（随机 32 字节，必须以 64 位 hex 或 Base64 编码；文件权限 0400/0600）；也可通过环境变量 LITEPAY_MASTER_KEY_FILE / LITEPAY_MASTER_KEY 提供
  master_key_file: ""
  # 离线轮换：以新密钥配置启动，添加 -rotate-master-key-from /path/to/old.key；成功后退出
  # /readyz 与 /readyz/providers/:provider 返回详细平台状态与原因所需的只读探针令牌；留空则仅已登录管理员可见详情
  # 留空禁用探针令牌；配置时至少 16 字节随机值，仅通过 X-Readiness-Token / X-Probe-Token / Authorization Header 传递。
  readiness_token: ""
  # production 为 true 时必须填写；商户回调仅允许匹配此精确主机名列表且强制使用 HTTPS
  notify_hosts: []

database:
  path: "./data/litepay-dev.db"

admin:
  # 后台管理入口路径前缀，建议修改为不易被猜测的单层路径；亦可在管理后台中调整
  path: "/admin"
  username: "admin"
  # 留空将禁用后台管理；本地开发明文密码至少 12 个字符，生产模式必须为 bcrypt 哈希（$2a$/$2b$/$2y$）
  password: ""
  session_hours: 12

log_level: "info"
